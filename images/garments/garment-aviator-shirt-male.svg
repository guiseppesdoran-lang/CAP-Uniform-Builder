<svg xmlns="http://www.w3.org/2000/svg" width="27.4652in" height="28.4792in" viewBox="0 0 2746.52 2847.92" data-asset-id="garment-aviator-shirt-male" data-source="reference-art-measured" data-units="0.01in"><title>Men's Aviator Shirt Uniform: white short-sleeve aviator shirt, gray trousers</title><metadata>{"asset_id":"garment-aviator-shirt-male","name":"Men's Aviator Shirt Uniform: white short-sleeve aviator shirt, gray trousers","size_in":{"w":27.4652,"h":28.4792},"units":"1 user unit = 0.01 in","viewBox":[0,0,2746.52,2847.92],"size_source":"estimated","size_basis":"Silhouette traced from images/base/aviator_shirt_male.webp (581x719 px; the female outline is traced from the clean 1130x1392 re-render of the same drawing) at 0.0376 in per 581-px-canvas px, chosen so the shirt is the same body width as the Class B shirt (20.8 in sleeve to sleeve before the sleeves were widened). The two sleeves are then widened outward by up to 1 in (smooth ramp from the shoulder end at 3.85 in to full at 6.86 in below the top, body side untouched) so the regulation 3 1/2 in chevron sits on the sleeve: the hanging view traced here is only 2.95 in wide at the chevron line (x 1.204 after the scale). The widening is an estimate (the regulation gives no sleeve width). Then the whole sheet is scaled by 1.2037 (LIVE-ART2 item 1; 0.0376 in/px becomes 0.0453): the men's pocket measures 4.36 in wide on the traced image and a USAF-style men's size-M short-sleeve shirt pocket is about 5.25 x 6 in (ESTIMATE: AF shirt pattern dimension supplied with the task; no CAPR 39-1 or DAFI 36-2903 dimension), so the men's pocket is drawn 5.25 x 6.0 in. Nametag and ribbon slots, edge-on strip thickness and the tie tab keep their true size. No real garment was measured.","anchors":{"top_center":[1373.26,0],"bottom_center":[1373.26,2847.92],"center":[1373.26,1423.96],"left_edge":[0,1423.96],"right_edge":[2746.52,1423.96],"shoulder_seam_right":[393.41,396.74],"sleeve_bottom_right":[310.79,1590.55],"chevron_hal