<svg xmlns="http://www.w3.org/2000/svg" width="25.8626in" height="32.9106in" viewBox="0 0 2586.26 3291.06" data-asset-id="garment-blues-class-b-shirt-male-long-cord-aide-de-camp" data-source="original" data-units="0.01in"><title>Men's Class B blue long-sleeve shirt: USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-shirt-male-long)</title><metadata>{"asset_id":"garment-blues-class-b-shirt-male-long-cord-aide-de-camp","name":"Men's Class B blue long-sleeve shirt: USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-shirt-male-long)","size_in":{"w":25.8626,"h":32.9106},"units":"1 user unit = 0.01 in","viewBox":[0,0,2586.26,3291.06],"size_source":"estimated","size_basis":"Same box as garment-blues-class-b-shirt-male-long; 0.36 in braid following the wearer's left armhole seam; colours from assets/cords/cord-aide-de-camp.spec.json. The regulation gives no cord dimension. Aiguillette parts (loop, whipping, thin cord, pencil tip) are drawn as the overlay's own groups: proportions in braid thicknesses B (0.36 in here) from Vanguard SKU 3710210 (assets/cords/ref/README.md): free loop 5.9 x 4.7 B outer = 2.1 x 1.7 in, an oval with its inner edge on the run, whipping 0.9 x 2.6 B, thin cord 3.9 B long and 0.14 B thick, pencil tip 1.2 in (4.1 B at the 0.30 in braid of cord-aide-de-camp), so the tip point hangs about 4.0 in below the contact point. Where the loop leaves the run (1.9 in down the run from its shoulder end) is estimated.","anchors":{"top_center":[1293.1299999999999,0],"bottom_center":[1293.1299999999999,3291.0600000000004],"center":[1293.1299999999999,1645.5300000000002],"left_edge":[0,1645.5300000000002],"right_edge":[2586.2599999999998,1645.5300000000002],"cord_start":[2260.06,287.51],"cord_end":[2084.6,1604.45],"aiguillette_attach":[2221.28,473.51],"aiguillette_tip":[2037.33,845.17]},"landmarks":{"cord":[[2260.03,287.5],[2241.73,374.9],[