<svg xmlns="http://www.w3.org/2000/svg" width="25.1882in" height="32.9532in" viewBox="0 0 2518.82 3295.32" data-asset-id="garment-blues-class-b-blouse-female-cord-aide-de-camp" data-source="original" data-units="0.01in"><title>Women's Class B blue short-sleeve blouse and skirt (nametag position only): USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-blouse-female)</title><metadata>{"asset_id":"garment-blues-class-b-blouse-female-cord-aide-de-camp","name":"Women's Class B blue short-sleeve blouse and skirt (nametag position only): USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-blouse-female)","size_in":{"w":25.1882,"h":32.9532},"units":"1 user unit = 0.01 in","viewBox":[0,0,2518.82,3295.32],"size_source":"estimated","size_basis":"Same box as garment-blues-class-b-blouse-female; 0.36 in braid following the wearer's left armhole seam; colours from assets/cords/cord-aide-de-camp.spec.json. The regulation gives no cord dimension. Aiguillette parts (loop, whipping, thin cord, pencil tip) are drawn as the overlay's own groups: proportions in braid thicknesses B (0.36 in here) from Vanguard SKU 3710210 (assets/cords/ref/README.md): free loop 5.9 x 4.7 B outer = 2.1 x 1.7 in, an oval with its inner edge on the run, whipping 0.9 x 2.6 B, thin cord 3.9 B long and 0.14 B thick, pencil tip 1.2 in (4.1 B at the 0.30 in braid of cord-aide-de-camp), so the tip point hangs about 4.0 in below the contact point. Where the loop leaves the run (1.9 in down the run from its shoulder end) is estimated.","anchors":{"top_center":[1259.4099999999999,0],"bottom_center":[1259.4099999999999,3295.32],"center":[1259.4099999999999,1647.66],"left_edge":[0,1647.66],"right_edge":[2518.8199999999997,1647.66],"cord_start":[2192.67,257.11],"cord_end":[1956.36,1650.09],"aiguillette_attach":[2136.35,438.57],"aiguillette_tip":[1935.85,801.57]},"landmarks":{"cord":[[2192.71,257.1],[2045.41,731.6],[1975.11,1050.3],[1965.71,1354.9],[1956.41,1650.1]],"aiguillette_loop":{"x":1952.9,"y":323.36,"w_in":1.977,"h_in":1.788},"aiguillette_pendant":{"x":1934.7,"y":323.36,"w_in":2.159,"h_in":4.785},"aiguillette_tip":{"x":1935.85,"y":801.57,"head_x":1969.18,"head_y":686.29,"len_in":1.2,"hang_deg":16.1,"box":{"x":1934.7,"y":683.93,"w_in":0.426,"h_in":1.18}}},"landmarks_note":"polygons are [[x,y]...] in user units (0.01 in); aiguillette_loop, aiguillette_pendant: {x,y} top-left of the box in user units, w_in/h_in in inches (pendant = loop + whipping + thin cord + tip, the keep-clear box); aiguillette_tip: {x,y} the tip point, head_x/head_y the cup end where the thin cord enters, len_in, hang_deg (the pendant is rotated this many degrees clockwise about the loop contact point so it hangs along the run slope), box = the tip's own bounding box","overlay_of":"garment-blues-class-b-blouse-female","documented":["shoulder cords are worn on the left shoulder aligned along the shoulder seam, underneath the epaulet (CAPR 39-1 9.3)","CAPR 39-1 9.3.4: the USAF Aide de Camp Shoulder Cord is worn on the left sleeve, only on the Service and Service Dress uniforms; DAFI 36-2903 10.7.7.1 describes it as a single-loop aiguillette with a chrome tip"],"assumed":["cord thickness 0.36 in","path along the armhole seam","loop, whipping and thin-cord proportions read from one product photo (Vanguard SKU 3710210, screenshot 800 x 667)","loop touches the run 1.9 in below its shoulder end, tip on the chest about 3.2 in below that contact point"],"fit":{"method":"original","score":null},"grade":"accessory","dimensions":{"braid_thickness_in":0.36,"loop_outer_in":[2.12,1.69],"tip_length_in":1.2,"pendant_drop_in":4.79}}</metadata><defs>
