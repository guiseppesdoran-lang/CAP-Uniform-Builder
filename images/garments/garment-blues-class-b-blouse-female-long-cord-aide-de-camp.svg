<svg xmlns="http://www.w3.org/2000/svg" width="24.5174in" height="36.3441in" viewBox="0 0 2451.74 3634.41" data-asset-id="garment-blues-class-b-blouse-female-long-cord-aide-de-camp" data-source="original" data-units="0.01in"><title>Women's Class B blue long-sleeve blouse: USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-blouse-female-long)</title><metadata>{"asset_id":"garment-blues-class-b-blouse-female-long-cord-aide-de-camp","name":"Women's Class B blue long-sleeve blouse: USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-blouse-female-long)","size_in":{"w":24.5174,"h":36.3441},"units":"1 user unit = 0.01 in","viewBox":[0,0,2451.74,3634.41],"size_source":"estimated","size_basis":"Same box as garment-blues-class-b-blouse-female-long; 0.36 in braid following the wearer's left armhole seam; colours from assets/cords/cord-aide-de-camp.spec.json. The regulation gives no cord dimension. LIVE9-ART 2: the aiguillette is drawn as worn on a USAF service dress coat (assets/cords/ref/aiguillette-worn-usaf-service-dress-screenshot.jpg, README): from under the epaulet the braid continues as two draped loops hanging down the chest, a short one (legs 2.24 B apart, bottom 10.0 B below the epaulet edge) beside the run and a long one (the run is its right leg; legs 4.14 B apart, bottom 15.0 B), each turning up on the chest side into a free end 3.9 B below the epaulet edge; from each free end a thin cord (0.14 B) runs to a whipping (0.7 x 1.8 B) and on to a silver pencil tip 3.2 B long (1.15 in at the 0.36 in braid, B = 0.36 in), the two tips 0.8 B apart, ending 14.7 B below the epaulet edge. B is the braid thickness read on the photo (about 50 px at x4 of the 314 x 236 px preview); the leg offset, drape depths and widths are read in B from the same picture. The pendant is measured along the run (its legs follow the armhole seam), the free ends and tips hang parallel to it. How the real cord hangs on a person varies; the photograph is one mannequin.","anchors":{"top_center":[1225.8712042116981,0],"bottom_center":[1225.8712042116981,3634.4100000000003],"center":[1225.8712042116981,1817.2050000000002],"left_edge":[0,1817.2050000000002],"right_edge":[2451.7424084233962,1817.2050000000002],"cord_start":[2146.09,251.71],"cord_end":[1923.37,1544.2],"aiguillette_attach":[2125.46,364.52],"aiguillette_tip":[1799.34,818.5]},"landmarks":{"cord":[[2146.07,251.7],[2134.27,337],[2126.87,360.2],[2118.07,387.6],[2108.17,418.2],[2097.47,451.6],[2086.17,486.9],[2074.47,523.6],[2062.77,560.8],[2051.27,597.9],[2040.07,634.3],[2029.67,669.1],[2020.17,701.8],[2011.87,731.6],[2002.27,766.5],[1993.27,798.6],[1984.87,828.7],[1977.07,857.5],[1969.87,885.9],[1963.17,914.7],[1956.97,944.8],[1951.37,976.9],[1946.27,1011.7],[1941.57,1050.3],[1938.77,1079.1],[1936.37,1111.2],[1934.27,1145.8],[1932.47,1182.3],[1930.97,1220.2],[1929.67,1258.9],[1928.57,1297.8],[1927.67,1336.3],[1926.87,1373.8],[1926.17,1409.7],[1925.57,1443.3],[1924.97,1474.2],[1924.47,1501.7],[1923.97,1525.3],[1923.37,1544.2]],"aiguillette_loop":{"x":1824.67,"y":296.59,"w_in":2.997,"h_in":5.85},"aiguillette_pendant":{"x":1770.65,"y":296.59,"w_in":3.537,"h_in":5.85},"aiguillette_tip":{"x":1799.34,"y":818.5,"head_x":1832.84,"head_y":708.28,"len_in":1.152,"hang_deg":16.91,"box":{"x":1770.65,"y":697.43,"w_in":0.703,"h_in":1.214},"tips":[{"x":1799.34,"y":818.5,"head_x":1832.84,"head_y":708.28},{"x":1771.78,"y":810.12,"head_x":1805.29,"head_y":699.9}]}},"landmarks_note":"polygons are [[x,y]...] in user units (0.01 in); aiguillette_loop (the two braided loops), aiguillette_pendant (the whole drape: loops, thin cords, whippings, tips, the keep-clear box): {x,y} top-left of the box in user units, w_in/h_in in inches; aiguillette_tip: {x,y} the lower tip's point, head_x/head_y its cup end, len_in, hang_deg (degrees the run leans toward the chest where the pendant hangs from it; the free ends and tips hang parallel to the run), box = both tips' bounding box, tips = both tip points {x,y,head_x,head_y}","overlay_of":"garment-blues-class-b-blouse-female-long","documented":["shoulder cords are worn on the left shoulder aligned along the shoulder seam, underneath the epaulet (CAPR 39-1 9.3)","CAPR 39-1 9.3.4: the USAF Aide de Camp Shoulder Cord is worn on the left sleeve, only on the Service and Service Dress uniforms; DAFI 36-2903 10.7.7.1 describes it as a single-loop aiguillette with a chrome tip"],"assumed":["cord thickness 0.36 in","path along the armhole seam","loop depths, widths and tip length read in braid thicknesses from one photograph of a USAF silver aiguillette on a service dress coat (assets/cords/ref/)","the drape hangs from where the braids leave the epaulet (1.15 in down the run from its shoulder end); the long loop leaves the run 12.9 B (4.6 in) below that point"],"fit":{"method":"original","score":null},"grade":"accessory","dimensions":{"braid_thickness_in":0.36,"short_loop_bottom_b":10,"long_loop_bottom_b":15.2,"free_ends_b":3.9,"tip_length_in":1.15,"tip_length_b":3.2,"pendant_drop_in":5.85}}</metadata><defs>
