<svg xmlns="http://www.w3.org/2000/svg" width="24.5174in" height="36.3441in" viewBox="0 0 2451.74 3634.41" data-asset-id="garment-blues-class-b-blouse-female-long-cord-aide-de-camp" data-source="original" data-units="0.01in"><title>Women's Class B blue long-sleeve blouse: USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-blouse-female-long)</title><metadata>{"asset_id":"garment-blues-class-b-blouse-female-long-cord-aide-de-camp","name":"Women's Class B blue long-sleeve blouse: USAF aide de camp aiguillette cord (silver, single loop, chrome tip) (overlay, registered to garment-blues-class-b-blouse-female-long)","size_in":{"w":24.5174,"h":36.3441},"units":"1 user unit = 0.01 in","viewBox":[0,0,2451.74,3634.41],"size_source":"estimated","size_basis":"Same box as garment-blues-class-b-blouse-female-long; 0.36 in braid following the wearer's left armhole seam; colours from assets/cords/cord-aide-de-camp.spec.json. The regulation gives no cord dimension. Aiguillette parts (loop, whipping, thin cord, pencil tip) are drawn as the overlay's own groups: proportions in braid thicknesses B (0.36 in here) from Vanguard SKU 3710210 (assets/cords/ref/README.md): free loop 5.9 x 4.7 B outer = 2.1 x 1.7 in, an oval with its inner edge on the run, whipping 0.9 x 2.6 B, thin cord 3.9 B long and 0.14 B thick, pencil tip 1.2 in (4.1 B at the 0.30 in braid of cord-aide-de-camp), so the tip point hangs about 4.0 in below the contact point. Where the loop leaves the run (1.9 in down the run from its shoulder end) is estimated.","anchors":{"top_center":[1225.8712042116981,0],"bottom_center":[1225.8712042116981,3634.4100000000003],"center":[1225.8712042116981,1817.2050000000002],"left_edge":[0,1817.2050000000002],"right_edge":[2451.7424084233962,1817.2050000000002],"cord_start":[2159.13,257.11],"cord_end":[1922.83,1650.09],"aiguillette_attach":[2102.81,438.57],"aiguillette_tip":[1902.32,801.57]},"landmarks":{"cord":[[2159.17,257.1],[2011.87,731.6],[1941.57,1050.3],[1932.17,1354.9],[1922.87,1650.1]],"aiguillette_loop":{"x":1919.36,"y":323.36,"w_in":1.977,"h_in":1.788},"aiguillette_pendant":{"x":1901.16,"y":323.36,"w_in":2.159,"h_in":4.785},"aiguillette_tip":{"x":1902.32,"y":801.57,"head_x":1935.64,"head_y":686.29,"len_in":1.2,"hang_deg":16.1,"box":{"x":1901.16,"y":683.93,"w_in":0.426,"h_in":1.18}}},"landmarks_note":"polygons are [[x,y]...] in user units (0.01 in); aiguillette_loop, aiguillette_pendant: {x,y} top-left of the box in user units, w_in/h_in in inches (pendant = loop + whipping + thin cord + tip, the keep-clear box); aiguillette_tip: {x,y} the tip point, head_x/head_y the cup end where the thin cord enters, len_in, hang_deg (the pendant is rotated this many degrees clockwise about the loop contact point so it hangs along the run slope), box = the tip's own bounding box","overlay_of":"garment-blues-class-b-blouse-female-long","documented":["shoulder cords are worn on the left shoulder aligned along the shoulder seam, underneath the epaulet (CAPR 39-1 9.3)","CAPR 39-1 9.3.4: the USAF Aide de Camp Shoulder Cord is worn on the left sleeve, only on the Service and Service Dress uniforms; DAFI 36-2903 10.7.7.1 describes it as a single-loop aiguillette with a chrome tip"],"assumed":["cord thickness 0.36 in","path along the armhole seam","loop, whipping and thin-cord proportions read from one product photo (Vanguard SKU 3710210, screenshot 800 x 667)","loop touches the run 1.9 in below its shoulder end, tip on the chest about 3.2 in below that contact point"],"fit":{"method":"original","score":null},"grade":"accessory","dimensions":{"braid_thickness_in":0.36,"loop_outer_in":[2.12,1.69],"tip_length_in":1.2,"pendant_drop_in":4.79}}</metadata><defs>
