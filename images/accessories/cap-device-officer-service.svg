1.2.1)"],"assumed":["feather and leaf shapes are stylised (the figure is a ~190 px raster, too coarse to trace)","relief shading reduced to two flat tones","CAP triangle inside the disc (faint in the figure)"]}</metadata><path id="cap-device-officer-service__wreath_l__stem" d="M74.59,215.22L65.42,213.02L56.25,210.82L48.30,205.07L40.35,199.32L34.85,190.76L29.35,182.20L25.92,172.42L22.50,162.64L20.79,152.85L19.08,143.07L19.08,133.29L19.08,123.51" fill="none" stroke="#8f969e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path id="cap-device-officer-service__wreath_l__leaves_a" d="M74.59,215.22C69.49,223.92 55.58,226.93 45.27,226.18C52.56,218.85 65.03,211.99 74.59,215.22ZM65.42,213.02C60.40,221.61 46.70,224.57 36.54,223.82C43.71,216.59 56.00,209.83 65.42,213.02ZM56.25,210.82C48.46,216.77 34.87,214.33 25.90,209.82C35.14,205.92 48.87,204.36 56.25,210.82ZM48.30,205.07C40.63,210.95 27.25,208.54 18.42,204.09C27.52,200.23 41.03,198.70 48.30,205.07ZM40.35,199.32C31.21,201.97 19.81,194.95 13.32,187.70C23.05,187.42 35.98,190.86 40.35,199.32ZM34.85,190.76C25.84,193.39 14.63,186.47 8.25,179.32C17.83,179.04 30.56,182.42 34.85,190.76ZM29.35,182.20C20.12,182.67 10.98,173.48 6.51,165.17C15.75,167.08 27.16,173.22 29.35,182.20ZM25.92,172.42C16.83,172.89 7.85,163.85 3.46,155.67C12.55,157.54 23.78,163.57 25.92,172.42ZM22.50,162.64C13.59,161.65 6.33,151.44 3.39,142.80C11.92,146.05 21.85,153.70 22.50,162.64ZM20.79,152.85C12.02,151.90 4.88,141.86 2.00,133.35C10.40,136.55 20.16,144.06 20.79,152.85ZM19.08,143.07C10.74,140.67 5.53,129.74 4.20,121.01C11.79,125.52 19.98,134.44 19.08,143.07ZM19.08,133.29C10.87,130.94 5.76,120.20 4.46,111.62C11.93,116.04 19.98,124.80 19.08,133.29Z" fill="#bcc1c8" stroke="#8f969e" stroke-width="0.9" stroke-linejoin="round"/><path id="cap-device-officer-service__wreath_l__leaves_b" d="M74.59,215.22C66.67,215.43 60.02,207.22 57.24,199.87C64.88,201.73 73.84,207.33 74.59,215.22ZM65.42,213.02C57.61,213.24 51.06,205.15 48.33,197.90C55.86,199.72 64.69