<svg xmlns="http://www.w3.org/2000/svg" width="11.500in" height="6.900in" viewBox="0 0 1150 690" data-asset-id="hat-service-cap-men-field-grade" data-source="reference-art-measured" data-units="0.01in"><title>Men's service cap (wheel cap), field grade officers (2 clouds and darts)</title><metadata>{"asset_id":"hat-service-cap-men-field-grade","name":"Men's service cap (wheel cap), field grade officers (2 clouds and darts)","size_in":{"w":11.5,"h":6.9},"units":"1 user unit = 0.01 in","viewBox":[0,0,1150,690],"colours":{"navy":"#0b1f5e","navyD":"#06143f","black":"#161616","strap":"#2b2b2d","silver":"#d3d7dc","silverD":"#8f969e","button":"#b9bec4","red":"#d03638","discBlue":"#14308f","cloudShade":"#9aa1a9"},"grade":"accessory","size_source":"estimated","size_basis":"Not dimensioned in CAPR 39-1 beyond the 1 3/4 in band braid (6.2.1.1.1). Scaled so the band is 7.4 in across (head ~22.5 in, as in base-art/hats.js); proportions read from CAPR 39-1 Fig A5-8 / A5-9 front views.","provenance":"drawn from CAPR 39-1 Fig A5-8 (front views of the four men's service caps); crown ellipse, visor and cloud/bolt/dart placement read off the 10x render (base-art/rank-traces/capdev-src/cap_*_10x.png); no cap was measured","anchors":{"top_center":[575,0],"bottom_center":[575,690],"center":[575,345],"left_edge":[0,345],"right_edge":[1150,345],"device_slot_center":[575,156.29999999999998],"garment_attach_center":[575,459.99999999999994],"band_top_center":[575,285],"visor_center":[575,569.9999999999999],"front_center":[575,345]},"landmarks":{"device_slot":{"x":475,"y":56.3,"w":200,"h":200},"band":{"x":204.99999999999997,"y":285,"w":740,"h":175}},"landmarks_note":"rects are {x,y,w,h} in user units (0.01 in); device_slot is a nominal 2 in box centred where the CAP service cap insignia sits (centred on the front of the crown)","dimensions":{"crown_w_in":11.3,"crown_h_in":3.84,"crown_top_to_band_top_in":2.75,"band_w_in":7.4,"band_h_in":1.75,"visor_drop_in":2.25,"clouds_and_darts_per_side":2,"visor":"black"},"documented":["visor-type cap banded with dark blue 1 3/4 in braid, front black chinstrap (6.2.1.1.1)","general officers: three clouds and darts on each side of the visor (6.2.1.3.1)","field grade (Col, Lt Col, Maj): two on each side (6.2.1.3.2)","company grade, flight officers, NCOs, cadet officers: plain black visor (6.2.1.3.3)","officers and NCOs wear the CAP service cap insignia / NCO device centred on the front (6.2.1.1.1, ICL 25-02)","worn by officers, NCOs and cadet officers with Class A and Class B; not cadet NCOs or Airmen (6.2.1.1)"],"assumed":["all dimensions except the band height","colours sampled from the figure","chinstrap and button size","cloud, bolt and dart ornaments are geometric (cumulus lobes, serrated strip, arrow) laid along the visor edge as on the figure, not the embroidered pattern","visor drawn as a bowl 7.1 in wide and 1.9 in deep (read off the figure, about 1.85 in deep against the 7.4 in band)","crown drawn as an ellipse 11.5 in wide and 2.8 in from its top to the band top: the figure scales to 2.63 in, raised so the 2.375 in device (Vanguard) keeps the figure's clear space above it","cloud centres, sizes and bolt lengths read off the 1860 px figure (u, offset and size tables in build-caps.js), cloud shapes are stylised lobes"]}</metadata><g transform="scale(100)"><path id="hat-service-cap-men-field-grade__crown" d="M0.1,1.97 A5.650,1.87 0 1 1 11.400,1.97 A5.650,1.87 0 1 1 0.1,1.97 Z" fill="#0b1f5e" stroke="#06143f" stroke-width="0.04" stroke-linejoin="round"/><rect id="hat-service-cap-men-field-grade__band" x="2.050" y="2.85" width="7.4" height="1.75" fill="#0b1f5e" stroke="#06143f" stroke-width="0.04"/><path d="M2.050,3.100L9.450,3.100" stroke="#06143f" stroke-width="0.03"/><path d="M2.050,3.350L9.450,3.350" stroke="#06143f" stroke-width="0.03"/><path d="M2.050,3.600L9.450,3.600" stroke="#06143f" stroke-width="0.03"/><path d="M2.050,3.850L9.450,3.850" stroke="#06143f" stroke-width="0.03"/><path d="M2.050,4.100L9.450,4.1