) on garment-ocp-coat-abu-cut's hhq_patch_left_center, the left sleeve pocket's loop field, as it does those patches; OCP only, one tab, in lieu of the HHQ patch (7.1.1.4.2.1). LIVE13-ART 2's placement above_cap_tape and anchor seat_on_cap_tape (ABU / CFU wear above the CAP tape) are withdrawn","dimensions":{"family":"patch","kind":"ranger-tab","group":"Hawk Mountain Ranger tabs","grade":"ranger-3rd-class","colour":"full","one_only":true,"frame_in":{"top_bottom":0.051,"ends":0.065,"outline":0.011},"corner_radius_in":0.032,"cap_height_in":0.233,"lettering_width_in":2.367,"lettering_condense":0.955,"lettering":"RANGER 3RD CLASS","colours":{"field":"#6f6f6f","frame":"#fbfcfb","letters":"#faf9f9","outline":"#8f8f8e"}},"source":{"figure":"assets/refs/capranger/fig-a8-2-ranger-tabs-crop.png (CAPR 39-1 Fig A8-2, PDF p.184 at 2x)","graphics":"assets/refs/capranger/tab-1..4.png (capranger.org)","poster":"assets/refs/capranger/hmrs-uniform-poster-2021.png (capranger.org, 2021 HMRS uniform poster: the tab worn)","measure":"artwork-samples/assets/ranger-tabs-measure.js (proportions, figure); artwork-samples/base-art/ranger-tab-poster-measure.js (size, poster)","measured":["width (poster, against the CAP tape)","width / height (figure)","frame widths","cap height","lettering width per tab","field, frame, lettering and outline colours (figure)"],"estimated":["the poster's CAP tape as 5 x 1 in (the inch scale; the coat sheets' tape width is itself estimated)","corner radius 0.06 in","word space 0.3 cap","superscript size 0.55 cap, its gap, its rule and the double space after it","typeface: Helvetica Neue Condensed Bold, the condensed sans the figure draws, scaled across to its width"]},"generator":"artwork-samples/assets/build-ranger-tabs.js","grade_note":"LIVE13-ART 2; resized to the OCP sleeve pocket, LIVE13-ART 3","fit":{"method":"n/a","score":null}}</metadata><g id="patch-ranger-tab-ranger-3rd-class__art" transform="scale(54)"><rect id="patch-ranger-tab-ranger-3rd-class__frame