name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests need no dependencies; npm install is not required.
      - run: npm test
      - run: npm run check:assets
      - run: npm run check:inline-syntax
