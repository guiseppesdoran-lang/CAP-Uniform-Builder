<svg xmlns="http://www.w3.org/2000/svg" width="8.200in" height="4.810in" viewBox="0 0 820 481" data-asset-id="hat-service-cap-women-cadet-officer" data-source="reference-art-measured" data-units="0.01in"><title>Women's service cap (bucket cap), cadet officers</title><metadata>{"asset_id":"hat-service-cap-women-cadet-officer","name":"Women's service cap (bucket cap), cadet officers","size_in":{"w":8.2,"h":4.81},"units":"1 user unit = 0.01 in","viewBox":[0,0,820,481],"colours":{"navy":"#0b1f5e","navyD":"#06143f","black":"#161616","strap":"#2b2b2d","silver":"#d3d7dc","silverD":"#8f969e","button":"#b9bec4","red":"#d03638","discBlue":"#14308f","cloudShade":"#9aa1a9"},"grade":"accessory","size_source":"estimated","size_basis":"Width 8.2 in kept (head ~22.5 in, as base-art/hats.js); outline measured from the CAPR 39-1 Fig A5-9 service cap (width : height = 1.705), so height 4.81 in. The regulation gives no cap dimensions.","provenance":"outline traced per column from CAPR 39-1 Fig A5-9 (women's service caps, p.140); crown plate and lower seam lines read off the figure","anchors":{"top_center":[409.99999999999994,0],"bottom_center":[409.99999999999994,480.99999999999994],"center":[409.99999999999994,240.49999999999997],"left_edge":[0,240.49999999999997],"right_edge":[819.9999999999999,240.49999999999997],"device_slot_center":[409.99999999999994,187.59],"garment_attach_center":[409.99999999999994,394.41999999999996],"front_center":[409.99999999999994,240.49999999999997]},"landmarks":{"device_slot":{"x":320,"y":97.58999999999999,"w":180,"h":180}},"landmarks_note":"rects are {x,y,w,h} in user units (0.01 in); device_slot is a nominal box centred where the CAP service cap insignia sits (centred on the front)","dimensions":{"width_in":8.2,"height_in":4.81,"clouds_and_darts_per_side":0,"visor":"blue (women's service cap visor is blue, 6.2.1.3.3)","difference_note":"cadet officer cap: same cap body as the officer/NCO cap; the difference is the device (cap-device-cadet-officer-service) and no clouds or darts (6.2.1.1.1, 6.2.1.2.1)"},"documented":["rounded design, sides form a front brim, solid blue hat cover (6.2.1.2.1)","Maj Gen / Brig Gen crown band: three clouds and darts per side; Col / Lt Col / Maj: two per side (Fig A5-9, 6.2.1.3.1-2)","cadet officers wear the cadet service cap insignia; no clouds or darts"],"assumed":["width","colours sampled from the figure","construction lines"]}</metadata><g transform="scale(100)"><defs><linearGradient id="hat-service-cap-women-cadet-officer__g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143077"/><stop offset="0.55" stop-color="#0b1f5e"/><stop offset="1" stop-color="#071a52"/></linearGradient></defs><path id="hat-service-cap-women-cadet-officer__body" d="M0.000,2.289L0.016,2.165L0.032,2.122L0.049,2.073L0.065,2.051L0.081,2.024L0.097,1.976L0.113,1.943L0.130,1.906L0.146,1.895L0.162,1.862L0.178,1.830L0.194,1.798L0.211,1.787L0.227,1.760L0.243,1.733L0.259,1.711L0.275,1.690L0.292,1.668L0.308,1.646L0.324,1.625L0.340,1.619L0.356,1.598L0.372,1.576L0.389,1.549L0.405,1.539L0.421,1.517L0.437,1.495L0.453,1.479L0.470,1.468L0.486,1.452L0.502,1.431L0.518,1.414L0.534,1.404L0.551,1.387L0.567,1.377L0.583,1.360L0.599,1.344L0.615,1.333L0.632,1.323L0.648,1.301L0.664,1.285L0.680,1.279L0.696,1.263L0.713,1.252L0.729,1.242L0.745,1.236L0.761,1.215L0.777,1.198L0.794,1.193L0.810,1.182L0.826,1.171L0.842,1.161L0.858,1.150L0.875,1.139L0.891,1.128L0.907,1.112L0.923,1.090L0.939,1.074L0.955,1.009L0.972,0.955L0.988,0.896L1.004,0.837L1.020,0.794L1.036,0.729L1.053,0.659L1.069,0.615L1.085,0.572L1.101,0.491L1.117,0.416L1.134,0.405L1.150,0.405L1.166,0.389L1.182,0.383L1.198,0.383L1.215,0.383L1.231,0.378L1.247,0.367L1.263,0.362L1.279,0.362L1.296,0.356L1.312,0.356L1.328,0.345L1.344,0.345L1.360,0.340L1.377,0.340L1.393,0.335L1.409,0.329L1.425,0.324L1.441,0.318L1.458,0.318L1.474,0.313L1.490,0.308L1.506,0.297L1.522,0.297L1.539,0.297L1.555,0.297L1.571,0.292L1.587,0.286L1.603,0.281L1.619,0.281L1.636,0.275L1.652,0.275L1.668,0.270L1.684